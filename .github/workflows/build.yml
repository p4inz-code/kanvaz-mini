name: Build

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: npm audit
        run: npm audit --audit-level=high

  build:
    name: Build (${{ matrix.os }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build Windows installers
        if: matrix.os == 'windows-latest'
        run: npm run build:win
      - name: Build Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:linux
      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.exe *.AppImage 2>/dev/null > SHA256SUMS-${{ matrix.os }}.txt || true
          cat SHA256SUMS-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kanvaz-mini-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/SHA256SUMS-*.txt

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create a draft release with the builds
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
